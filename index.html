<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SakuOne — Tabungan</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    :root {
      --bg: #000000;
      --surface: rgba(24, 26, 32, 0.72);
      --surface-2: rgba(38, 42, 52, 0.78);
      --border: rgba(255, 255, 255, 0.13);
      --text: #F8FAFC;
      --muted: #94A3B8;
      --accent: #3B82F6;
      --success: #10B981;
      --danger: #F43F5E;
      --spring: cubic-bezier(0.22, 1.28, 0.36, 1);
      --ease: cubic-bezier(0.25, 0.8, 0.25, 1);
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    [data-theme="light"] {
      --bg: #F2F4F8;
      --surface: rgba(255, 255, 255, 0.76);
      --surface-2: rgba(241, 245, 249, 0.88);
      --border: rgba(15, 23, 42, 0.09);
      --text: #0F172A;
      --muted: #64748B;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.85);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
      transition: background-color 0.35s var(--ease), color 0.35s var(--ease);
    }

    .app-shell {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: calc(env(safe-area-inset-top, 12px) + 12px) 16px calc(env(safe-area-inset-bottom, 16px) + 104px);
      position: relative;
    }

    /* Liquid Glass Surface */
    .glass {
      background: var(--surface);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .pressable {
      transition: transform 0.28s var(--spring), background-color 0.25s var(--ease), opacity 0.2s var(--ease);
    }

    .pressable:active {
      transform: scale(0.96);
    }

    /* Top Header */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 8px 4px;
      border-radius: 24px;
      transition: background 0.3s var(--ease), padding 0.3s var(--ease);
    }

    .top-header.scrolled {
      background: var(--surface);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid var(--border);
      padding: 8px 12px;
      box-shadow: var(--shadow);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      object-fit: cover;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }

    .large-title {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0;
      line-height: 1.1;
      transition: font-size 0.25s var(--ease);
    }

    .top-header.scrolled .large-title {
      font-size: 20px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    /* Total Balance Hero Card */
    .hero-card {
      border-radius: 28px;
      padding: 22px;
      position: relative;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .hero-glow {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      filter: blur(55px);
      opacity: 0.34;
      pointer-events: none;
      top: -60px;
      right: -40px;
      background: radial-gradient(circle, #3B82F6, #10B981);
    }

    .hero-label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 6px;
    }

    .hero-amount {
      font-size: clamp(26px, 7.5vw, 34px);
      font-weight: 750;
      letter-spacing: -0.03em;
      margin: 0 0 14px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hero-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill-stat {
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .pill-stat strong {
      color: var(--text);
    }

    /* Section Title */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 2px 12px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -0.01em;
      margin: 0;
    }

    .section-sub {
      font-size: 12px;
      color: var(--muted);
    }

    /* Pocket Cards */
    .pocket-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .view-stage {
      opacity: 1;
      transform: translate3d(0, 0, 0);
      will-change: transform, opacity;
    }

    .view-stage.slide-out-left {
      opacity: 0;
      transform: translate3d(-24px, 0, 0);
      transition: opacity 0.25s var(--ease), transform 0.25s var(--ease);
    }

    .view-stage.slide-out-right {
      opacity: 0;
      transform: translate3d(24px, 0, 0);
      transition: opacity 0.25s var(--ease), transform 0.25s var(--ease);
    }

    .view-stage.slide-enter-right {
      animation: slideEnterRight 1s var(--spring) both;
    }

    .view-stage.slide-enter-left {
      animation: slideEnterLeft 1s var(--spring) both;
    }

    @keyframes slideEnterRight {
      0% {
        opacity: 0;
        transform: translate3d(28px, 0, 0);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes slideEnterLeft {
      0% {
        opacity: 0;
        transform: translate3d(-28px, 0, 0);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    .pocket-card {
      border-radius: 28px;
      padding: 18px;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .pocket-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .pocket-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .pocket-badge {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .pocket-name {
      font-size: 16px;
      font-weight: 650;
      margin: 0 0 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pocket-target {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .pocket-pct {
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .pocket-balance {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      height: 8px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.2);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.65s var(--spring);
    }

    .pocket-actions {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
    }

    .btn-action {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--text);
      background: var(--surface-2);
    }

    .btn-deposit {
      background: rgba(16, 185, 129, 0.16);
      border-color: rgba(16, 185, 129, 0.35);
      color: #34D399;
    }

    [data-theme="light"] .btn-deposit {
      color: #047857;
    }

    .btn-withdraw {
      background: rgba(244, 63, 94, 0.14);
      border-color: rgba(244, 63, 94, 0.3);
      color: #FB7185;
    }

    [data-theme="light"] .btn-withdraw {
      color: #BE123C;
    }

    /* Stats View */
    .stats-card {
      border-radius: 28px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .donut-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .legend-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bars-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      align-items: end;
      height: 145px;
      padding-top: 12px;
    }

    .bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      height: 100%;
      justify-content: flex-end;
    }

    .bar-pair {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 105px;
      width: 100%;
      justify-content: center;
    }

    .bar-in, .bar-out {
      width: 8px;
      border-radius: 6px 6px 2px 2px;
      min-height: 3px;
      transition: height 0.55s var(--spring);
    }

    .bar-in { background: var(--success); }
    .bar-out { background: var(--danger); }

    .bar-month {
      font-size: 11px;
      color: var(--muted);
    }

    .perf-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .perf-item {
      border-radius: 20px;
      padding: 14px 16px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    /* History View */
    .filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .search-box {
      width: 100%;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 11px 14px;
      font-size: 14px;
      outline: none;
      margin-bottom: 10px;
    }

    .chip-btn {
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }

    .grouped-list {
      border-radius: 24px;
      overflow: hidden;
    }

    .tx-row {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .tx-row:last-child {
      border-bottom: none;
    }

    .tx-title {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 2px;
    }

    .tx-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .tx-amt {
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }

    .tx-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .tx-del-btn {
      width: 32px;
      height: 32px;
      border-radius: 11px;
      border: 1px solid rgba(244, 63, 94, 0.28);
      background: rgba(244, 63, 94, 0.12);
      color: #FB7185;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    [data-theme="light"] .tx-del-btn {
      color: #BE123C;
      background: rgba(244, 63, 94, 0.1);
    }

    .tx-row.removing {
      opacity: 0;
      transform: translateX(24px) scale(0.97);
      transition: opacity 0.25s var(--ease), transform 0.25s var(--ease);
    }

    /* Floating Glass Pill Tab Bar + FAB */
    .dock-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 12px) + 12px);
      display: flex;
      justify-content: center;
      z-index: 30;
      padding: 0 16px;
      pointer-events: none;
    }

    .dock-inner {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 400px;
      width: 100%;
      justify-content: space-between;
      pointer-events: auto;
    }

    .pill-nav {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 5px;
      border-radius: 999px;
    }

    .nav-item {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 9px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background 0.25s var(--ease), color 0.25s var(--ease), transform 0.25s var(--spring);
    }

    .nav-item.active {
      background: var(--accent);
      color: #FFFFFF;
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
    }

    .fab-btn {
      width: 52px;
      height: 52px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: var(--accent);
      color: #FFFFFF;
      font-size: 24px;
      font-weight: 500;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(59, 130, 246, 0.42);
      flex-shrink: 0;
    }

    /* Bottom Sheet Modal */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s var(--ease);
    }

    .sheet-backdrop.open {
      display: flex;
      opacity: 1;
    }

    .sheet-panel {
      width: 100%;
      max-width: 430px;
      border-radius: 32px 32px 0 0;
      padding: 14px 18px calc(env(safe-area-inset-bottom, 16px) + 22px);
      transform: translateY(100%);
      transition: transform 0.42s var(--spring);
      max-height: 88dvh;
      overflow-y: auto;
    }

    .sheet-backdrop.open .sheet-panel {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 40px;
      height: 5px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.45);
      margin: 0 auto 14px;
    }

    .sheet-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 14px;
    }

    .form-group {
      margin-bottom: 13px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-input {
      width: 100%;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
    }

    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 8px;
    }

    .q-chip {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .pocket-picker {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .pick-pill {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 16px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .pick-pill.selected {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.2);
    }

    .color-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .color-dot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .color-dot.selected {
      border-color: #FFFFFF;
      box-shadow: 0 0 0 2px var(--accent);
      transform: scale(1.08);
    }

    .btn-primary {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--accent);
      cursor: pointer;
    }

    .btn-danger-ghost {
      width: 100%;
      border: 1px solid rgba(244, 63, 94, 0.35);
      background: rgba(244, 63, 94, 0.12);
      color: #FB7185;
      border-radius: 18px;
      padding: 11px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    /* Floating Liquid Glass Toast */
    .toast {
      position: fixed;
      top: calc(env(safe-area-inset-top, 12px) + 12px);
      left: 50%;
      transform: translate(-50%, -140%);
      z-index: 80;
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: transform 0.45s var(--spring);
      pointer-events: none;
    }

    .toast.show {
      transform: translate(-50%, 0);
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 70;
    }
  </style>
</head>
<body>
  <canvas id="confettiCanvas"></canvas>
  <div id="toast" class="toast glass"></div>

  <div class="app-shell">
    <header id="topHeader" class="top-header">
      <div class="brand-row">
        <img src="./icon-192.png" alt="Logo SakuOne" class="brand-logo" />
        <h1 class="large-title">Tabungan</h1>
      </div>
      <div class="header-actions">
        <button id="privacyBtn" class="icon-btn pressable" aria-label="Sembunyikan saldo" title="Privasi Saldo">
          <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <button id="themeBtn" class="icon-btn pressable" aria-label="Ganti tema" title="Mode Terang/Gelap">
          <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="viewContainer"></main>
  </div>

  <!-- Floating Glass Pill Tab Bar + FAB -->
  <nav class="dock-wrap" aria-label="Navigasi utama">
    <div class="dock-inner">
      <div class="pill-nav glass">
        <button class="nav-item active" data-tab="pockets">Kantong</button>
        <button class="nav-item" data-tab="stats">Statistik</button>
        <button class="nav-item" data-tab="history">Riwayat</button>
      </div>
      <button id="fabAddPocket" class="fab-btn pressable" aria-label="Tambah kantong baru">+</button>
    </div>
  </nav>

  <!-- Sheet: Setor / Tarik -->
  <div id="txSheet" class="sheet-backdrop" role="dialog" aria-modal="true">
    <div class="sheet-panel glass">
      <div class="sheet-handle"></div>
      <h2 id="txSheetTitle" class="sheet-title">Setor Tabungan</h2>
      <div class="form-group">
        <label class="form-label">Pilih Kantong</label>
        <div id="txPocketPicker" class="pocket-picker"></div>
      </div>
      <div class="form-group">
        <label for="txAmountInput" class="form-label">Nominal (Rp)</label>
        <input id="txAmountInput" type="number" inputmode="numeric" class="form-input" placeholder="Contoh: 100000" />
        <div class="quick-chips">
          <button type="button" class="q-chip" data-add="50000">+50rb</button>
          <button type="button" class="q-chip" data-add="100000">+100rb</button>
          <button type="button" class="q-chip" data-add="250000">+250rb</button>
          <button type="button" class="q-chip" data-add="500000">+500rb</button>
          <button type="button" class="q-chip" data-add="1000000">+1jt</button>
        </div>
      </div>
      <div class="form-group">
        <label for="txNoteInput" class="form-label">Catatan (Opsional)</label>
        <input id="txNoteInput" type="text" class="form-input" placeholder="Misal: Gaji mingguan / sisa belanja" />
      </div>
      <button id="txSubmitBtn" type="button" class="btn-primary pressable">Simpan Transaksi</button>
    </div>
  </div>

  <!-- Sheet: Tambah / Edit Kantong -->
  <div id="pocketSheet" class="sheet-backdrop" role="dialog" aria-modal="true">
    <div class="sheet-panel glass">
      <div class="sheet-handle"></div>
      <h2 id="pocketSheetTitle" class="sheet-title">Kantong Baru</h2>
      <div class="form-group">
        <label for="pocketNameInput" class="form-label">Nama Kantong</label>
        <input id="pocketNameInput" type="text" class="form-input" placeholder="Contoh: Dana Darurat" />
      </div>
      <div class="form-group">
        <label for="pocketTargetInput" class="form-label">Target Tabungan (Rp)</label>
        <input id="pocketTargetInput" type="number" inputmode="numeric" class="form-input" placeholder="Contoh: 5000000" />
      </div>
      <div class="form-group">
        <label for="pocketEmojiInput" class="form-label">Emoji / Ikon</label>
        <input id="pocketEmojiInput" type="text" maxlength="4" class="form-input" value="💰" />
      </div>
      <div class="form-group">
        <label class="form-label">Warna Aksen AMOLED</label>
        <div id="colorPicker" class="color-row"></div>
      </div>
      <button id="pocketSaveBtn" type="button" class="btn-primary pressable">Simpan Kantong</button>
      <button id="pocketDeleteBtn" type="button" class="btn-danger-ghost pressable" style="display:none;">Hapus Kantong</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "sakuone_data_v1";
    const COLORS = ["#3B82F6", "#10B981", "#F59E0B", "#EC4899", "#8B5CF6", "#06B6D4", "#F97316", "#6366F1"];

    const DEFAULT_DATA = {
      hidden: false,
      theme: "dark",
      activeTab: "pockets",
      pockets: [
        { id: "p1", name: "Dana Darurat", emoji: "🛡️", balance: 3250000, target: 10000000, color: "#10B981" },
        { id: "p2", name: "Liburan Akhir Tahun", emoji: "✈️", balance: 1800000, target: 3000000, color: "#3B82F6" },
        { id: "p3", name: "Upgrade Gadget", emoji: "📱", balance: 2400000, target: 4500000, color: "#8B5CF6" },
        { id: "p4", name: "Tabungan Masa Depan", emoji: "🌱", balance: 5000000, target: 5000000, color: "#F59E0B" }
      ],
      transactions: [
        { id: "t1", pocketId: "p1", type: "deposit", amount: 750000, note: "Setoran awal bulan", date: new Date().toISOString() },
        { id: "t2", pocketId: "p2", type: "deposit", amount: 500000, note: "Tiket & penginapan", date: new Date(Date.now() - 86400000 * 3).toISOString() },
        { id: "t3", pocketId: "p3", type: "withdraw", amount: 350000, note: "Beli aksesoris pelindung", date: new Date(Date.now() - 86400000 * 7).toISOString() },
        { id: "t4", pocketId: "p4", type: "deposit", amount: 1500000, note: "Target tercapai", date: new Date(Date.now() - 86400000 * 14).toISOString() }
      ]
    };

    let state = loadState();
    let txMode = "deposit";
    let selectedTxPocketId = state.pockets[0]?.id || "";
    let editingPocketId = null;
    let selectedColor = COLORS[0];
    let historyFilter = "all";
    let historySearch = "";
    let prevTotalDisplay = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(DEFAULT_DATA);
        const parsed = JSON.parse(raw);
        return {
          ...structuredClone(DEFAULT_DATA),
          ...parsed,
          pockets: Array.isArray(parsed.pockets) && parsed.pockets.length ? parsed.pockets : structuredClone(DEFAULT_DATA.pockets),
          transactions: Array.isArray(parsed.transactions) ? parsed.transactions : structuredClone(DEFAULT_DATA.transactions)
        };
      } catch {
        return structuredClone(DEFAULT_DATA);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {}
    }

    function formatIDR(num) {
      if (state.hidden) return "Rp •••••••";
      return "Rp " + Math.round(Number(num) || 0).toLocaleString("id-ID");
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => el.classList.remove("show"), 2400);
    }

    function applyTheme() {
      document.documentElement.setAttribute("data-theme", state.theme);
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute("content", state.theme === "dark" ? "#000000" : "#F2F4F8");
      const icon = document.getElementById("themeIcon");
      if (state.theme === "dark") {
        icon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
      } else {
        icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
      }
    }

    function updateEyeIcon() {
      const icon = document.getElementById("eyeIcon");
      if (state.hidden) {
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    }

    const TAB_ORDER = ["pockets", "stats", "history"];
    let tabTransitionTimer = null;

    function render(slideDir = null) {
      applyTheme();
      updateEyeIcon();
      document.querySelectorAll(".nav-item").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === state.activeTab);
      });

      const container = document.getElementById("viewContainer");
      const stage = document.createElement("div");

      let enterClass = "";
      if (slideDir === "next") {
        enterClass = " slide-enter-right";
      } else if (slideDir === "prev") {
        enterClass = " slide-enter-left";
      }
      stage.className = "view-stage" + enterClass;

      if (state.activeTab === "pockets") {
        renderPocketsView(stage);
      } else if (state.activeTab === "stats") {
        renderStatsView(stage);
      } else {
        renderHistoryView(stage);
      }

      container.replaceChildren(stage);
    }

    function switchTabSmooth(nextTab) {
      if (nextTab === state.activeTab) return;
      const oldIndex = TAB_ORDER.indexOf(state.activeTab);
      const newIndex = TAB_ORDER.indexOf(nextTab);
      const direction = newIndex >= oldIndex ? "next" : "prev";

      state.activeTab = nextTab;
      saveState();

      document.querySelectorAll(".nav-item").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === state.activeTab);
      });

      const stage = document.querySelector("#viewContainer .view-stage");
      clearTimeout(tabTransitionTimer);

      if (stage) {
        stage.classList.add(direction === "next" ? "slide-out-left" : "slide-out-right");
        tabTransitionTimer = setTimeout(() => {
          render(direction);
          window.scrollTo({ top: 0, behavior: "instant" });
        }, 220);
      } else {
        render(direction);
        window.scrollTo({ top: 0, behavior: "instant" });
      }
    }

    function renderPocketsView(container) {
      const totalBalance = state.pockets.reduce((acc, p) => acc + Number(p.balance || 0), 0);
      const totalTarget = state.pockets.reduce((acc, p) => acc + Number(p.target || 0), 0);
      const overallPct = totalTarget > 0 ? Math.min(100, Math.round((totalBalance / totalTarget) * 100)) : 0;

      const pocketsHtml = state.pockets.map((p, idx) => {
        const pct = p.target > 0 ? Math.min(100, Math.round((p.balance / p.target) * 100)) : 0;
        return `
          <article class="pocket-card glass">
            <div class="pocket-top">
              <div class="pocket-info">
                <div class="pocket-badge" style="background:${p.color}22; color:${p.color}">${p.emoji || "💰"}</div>
                <div style="min-width:0">
                  <h2 class="pocket-name">${escapeHtml(p.name)}</h2>
                  <div class="pocket-target">Target ${formatIDR(p.target)}</div>
                </div>
              </div>
              <div class="pocket-pct" style="color:${p.color}">${pct}%</div>
            </div>
            <div class="pocket-balance">${formatIDR(p.balance)}</div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${pct}%; background:${p.color}"></div>
            </div>
            <div class="pocket-actions">
              <button type="button" class="btn-action btn-deposit pressable" onclick="openTxSheet('deposit','${p.id}')">+ Setor</button>
              <button type="button" class="btn-action btn-withdraw pressable" onclick="openTxSheet('withdraw','${p.id}')">− Tarik</button>
              <button type="button" class="btn-action pressable" onclick="openPocketSheet('${p.id}')">Edit</button>
            </div>
          </article>
        `;
      }).join("");

      container.innerHTML = `
        <section class="hero-card glass">
          <div class="hero-glow"></div>
          <div class="hero-label">Total Tabungan</div>
          <p id="heroTotalAmount" class="hero-amount">${formatIDR(totalBalance)}</p>
          <div class="hero-meta">
            <span class="pill-stat">Kantong: <strong>${state.pockets.length}</strong></span>
            <span class="pill-stat">Target Gabungan: <strong>${overallPct}%</strong></span>
          </div>
        </section>
        <div class="section-head">
          <h2 class="section-title">Kantong Tabungan</h2>
          <span class="section-sub">${state.pockets.length} aktif</span>
        </div>
        <div class="pocket-list">${pocketsHtml}</div>
      `;

      animateCountUp("heroTotalAmount", totalBalance);
    }

    function animateCountUp(elId, targetVal) {
      const el = document.getElementById(elId);
      if (!el || state.hidden) return;
      const startVal = prevTotalDisplay !== null ? prevTotalDisplay : targetVal;
      prevTotalDisplay = targetVal;
      if (startVal === targetVal) {
        el.textContent = formatIDR(targetVal);
        return;
      }
      const startTime = performance.now();
      const duration = 450;
      function step(now) {
        const p = Math.min(1, (now - startTime) / duration);
        const eased = 1 - Math.pow(1 - p, 3);
        const current = Math.round(startVal + (targetVal - startVal) * eased);
        el.textContent = formatIDR(current);
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function renderStatsView(container) {
      const total = state.pockets.reduce((s, p) => s + Number(p.balance || 0), 0);
      const radius = 42;
      const circ = 2 * Math.PI * radius;
      let offset = 0;

      const slices = state.pockets.map((p) => {
        const share = total > 0 ? Number(p.balance || 0) / total : 0;
        const len = share * circ;
        const circle = `<circle cx="54" cy="54" r="${radius}" fill="none" stroke="${p.color}" stroke-width="14" stroke-dasharray="${len} ${circ}" stroke-dashoffset="${-offset}" transform="rotate(-90 54 54)"/>`;
        offset += len;
        return circle;
      }).join("");

      const legend = state.pockets.map((p) => {
        const pct = total > 0 ? Math.round((p.balance / total) * 100) : 0;
        return `
          <div class="legend-item">
            <span class="legend-label"><span class="legend-dot" style="background:${p.color}"></span>${escapeHtml(p.name)}</span>
            <strong>${pct}%</strong>
          </div>
        `;
      }).join("");

      // 6 bulan terakhir
      const now = new Date();
      const months = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const mKey = `${d.getFullYear()}-${d.getMonth()}`;
        const label = d.toLocaleDateString("id-ID", { month: "short" });
        let dep = 0;
        let wit = 0;
        state.transactions.forEach((t) => {
          const td = new Date(t.date);
          if (`${td.getFullYear()}-${td.getMonth()}` === mKey) {
            if (t.type === "deposit") dep += Number(t.amount || 0);
            else wit += Number(t.amount || 0);
          }
        });
        months.push({ label, dep, wit });
      }
      const maxVal = Math.max(1, ...months.flatMap((m) => [m.dep, m.wit]));

      const barsHtml = months.map((m) => {
        const hIn = Math.max(4, Math.round((m.dep / maxVal) * 100));
        const hOut = Math.max(4, Math.round((m.wit / maxVal) * 100));
        return `
          <div class="bar-col">
            <div class="bar-pair">
              <div class="bar-in" style="height:${hIn}%" title="Setor: ${formatIDR(m.dep)}"></div>
              <div class="bar-out" style="height:${hOut}%" title="Tarik: ${formatIDR(m.wit)}"></div>
            </div>
            <span class="bar-month">${m.label}</span>
          </div>
        `;
      }).join("");

      // Performa
      const nearestPocket = [...state.pockets]
        .filter((p) => p.target > 0 && p.balance < p.target)
        .sort((a, b) => (b.balance / b.target) - (a.balance / a.target))[0] || state.pockets[0];

      const curMonthKey = `${now.getFullYear()}-${now.getMonth()}`;
      const monthDeposit = state.transactions
        .filter((t) => {
          const td = new Date(t.date);
          return t.type === "deposit" && `${td.getFullYear()}-${td.getMonth()}` === curMonthKey;
        })
        .reduce((s, t) => s + Number(t.amount || 0), 0);

      const completedCount = state.pockets.filter((p) => p.target > 0 && p.balance >= p.target).length;

      container.innerHTML = `
        <section class="stats-card glass">
          <h2 class="section-title" style="margin-bottom:12px;">Alokasi Kantong</h2>
          <div class="donut-wrap">
            <svg width="108" height="108" viewBox="0 0 108 108" style="flex-shrink:0;">
              <circle cx="54" cy="54" r="${radius}" fill="none" stroke="rgba(148,163,184,0.18)" stroke-width="14"/>
              ${slices}
            </svg>
            <div class="legend-list">${legend}</div>
          </div>
        </section>

        <section class="stats-card glass">
          <div class="section-head" style="margin-bottom:6px;">
            <h2 class="section-title">Setoran vs Penarikan (6 Bln)</h2>
            <span class="section-sub"><span style="color:var(--success)">● Setor</span> · <span style="color:var(--danger)">● Tarik</span></span>
          </div>
          <div class="bars-grid">${barsHtml}</div>
        </section>

        <section class="stats-card glass">
          <h2 class="section-title" style="margin-bottom:12px;">Ringkasan Performa</h2>
          <div class="perf-grid">
            <div class="perf-item">
              <div>
                <div class="tx-sub">Kantong Terdekat Target</div>
                <div class="tx-title">${nearestPocket ? `${nearestPocket.emoji} ${escapeHtml(nearestPocket.name)}` : "-"}</div>
              </div>
              <strong>${nearestPocket && nearestPocket.target > 0 ? Math.min(100, Math.round((nearestPocket.balance / nearestPocket.target) * 100)) + "%" : "0%"}</strong>
            </div>
            <div class="perf-item">
              <div>
                <div class="tx-sub">Total Setoran Bulan Ini</div>
                <div class="tx-title">${now.toLocaleDateString("id-ID", { month: "long", year: "numeric" })}</div>
              </div>
              <strong style="color:var(--success)">${formatIDR(monthDeposit)}</strong>
            </div>
            <div class="perf-item">
              <div>
                <div class="tx-sub">Tingkat Pencapaian Target</div>
                <div class="tx-title">${completedCount} dari ${state.pockets.length} kantong tercapai</div>
              </div>
              <strong>${state.pockets.length ? Math.round((completedCount / state.pockets.length) * 100) : 0}%</strong>
            </div>
          </div>
        </section>
      `;
    }

    function buildHistoryRowsHtml() {
      const txList = Array.isArray(state.transactions) ? state.transactions : [];
      const filtered = txList.filter((t) => {
        if (!t) return false;
        if (historyFilter !== "all" && t.type !== historyFilter) return false;
        const p = state.pockets.find((pk) => pk.id === t.pocketId);
        const hay = `${t.note || ""} ${p ? p.name : ""}`.toLowerCase();
        return hay.includes((historySearch || "").trim().toLowerCase());
      });

      if (!filtered.length) {
        return `<div class="tx-row"><div class="tx-sub">Belum ada transaksi yang sesuai.</div></div>`;
      }

      return filtered.map((t) => {
        const p = state.pockets.find((pk) => pk.id === t.pocketId);
        const isDep = t.type === "deposit";
        let dStr = "-";
        try {
          const parsedDate = new Date(t.date);
          if (!isNaN(parsedDate.getTime())) {
            dStr = parsedDate.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
          }
        } catch {}

        return `
          <div class="tx-row" id="tx_row_${escapeHtml(t.id)}">
            <div style="min-width:0">
              <p class="tx-title">${escapeHtml(t.note || (isDep ? "Setoran Tabungan" : "Penarikan Dana"))}</p>
              <div class="tx-sub">${p ? `${p.emoji || "💰"} ${escapeHtml(p.name)}` : "Kantong"} · ${dStr}</div>
            </div>
            <div class="tx-right">
              <div class="tx-amt" style="color:${isDep ? "var(--success)" : "var(--danger)"}">
                ${isDep ? "+" : "−"}${formatIDR(t.amount)}
              </div>
              <button type="button" class="tx-del-btn pressable" onclick="deleteTransaction('${escapeHtml(t.id)}')" aria-label="Hapus transaksi" title="Hapus">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"/>
                  <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                  <path d="M10 11v6"/>
                  <path d="M14 11v6"/>
                  <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                </svg>
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function refreshHistoryListOnly() {
      const listEl = document.getElementById("historyGroupedList");
      if (listEl) {
        listEl.innerHTML = buildHistoryRowsHtml();
      }
    }

    function renderHistoryView(container) {
      container.innerHTML = `
        <div class="section-head">
          <h2 class="section-title">Riwayat Transaksi</h2>
          <span class="section-sub">${Array.isArray(state.transactions) ? state.transactions.length : 0} catatan</span>
        </div>
        <input id="txSearchInput" type="search" class="search-box glass" placeholder="Cari catatan atau nama kantong..." value="${escapeHtml(historySearch)}" />
        <div class="filter-row">
          <button type="button" class="chip-btn ${historyFilter === "all" ? "active" : ""}" data-filter="all">Semua</button>
          <button type="button" class="chip-btn ${historyFilter === "deposit" ? "active" : ""}" data-filter="deposit">Setoran</button>
          <button type="button" class="chip-btn ${historyFilter === "withdraw" ? "active" : ""}" data-filter="withdraw">Penarikan</button>
        </div>
        <div id="historyGroupedList" class="grouped-list glass">${buildHistoryRowsHtml()}</div>
      `;

      const searchEl = document.getElementById("txSearchInput");
      if (searchEl) {
        searchEl.addEventListener("input", (e) => {
          historySearch = e.target.value;
          refreshHistoryListOnly();
        });
      }

      container.querySelectorAll(".chip-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          historyFilter = btn.dataset.filter;
          container.querySelectorAll(".chip-btn").forEach((b) => {
            b.classList.toggle("active", b.dataset.filter === historyFilter);
          });
          refreshHistoryListOnly();
        });
      });
    }

    function openTxSheet(type, pocketId) {
      txMode = type;
      selectedTxPocketId = pocketId || state.pockets[0]?.id || "";
      document.getElementById("txSheetTitle").textContent = type === "deposit" ? "Setor Tabungan" : "Tarik Dana";
      document.getElementById("txAmountInput").value = "";
      document.getElementById("txNoteInput").value = "";
      renderTxPocketPicker();
      openSheet("txSheet");
      setTimeout(() => document.getElementById("txAmountInput").focus(), 180);
    }

    function renderTxPocketPicker() {
      const wrap = document.getElementById("txPocketPicker");
      wrap.innerHTML = state.pockets.map((p) => `
        <button type="button" class="pick-pill pressable ${p.id === selectedTxPocketId ? "selected" : ""}" onclick="selectTxPocket('${p.id}')">
          ${p.emoji} ${escapeHtml(p.name)}
        </button>
      `).join("");
    }

    function selectTxPocket(id) {
      selectedTxPocketId = id;
      renderTxPocketPicker();
    }

    function openPocketSheet(pocketId = null) {
      editingPocketId = pocketId;
      const delBtn = document.getElementById("pocketDeleteBtn");
      if (pocketId) {
        const p = state.pockets.find((item) => item.id === pocketId);
        if (!p) return;
        document.getElementById("pocketSheetTitle").textContent = "Edit Kantong";
        document.getElementById("pocketNameInput").value = p.name;
        document.getElementById("pocketTargetInput").value = p.target;
        document.getElementById("pocketEmojiInput").value = p.emoji || "💰";
        selectedColor = p.color || COLORS[0];
        delBtn.style.display = state.pockets.length > 1 ? "block" : "none";
      } else {
        document.getElementById("pocketSheetTitle").textContent = "Kantong Baru";
        document.getElementById("pocketNameInput").value = "";
        document.getElementById("pocketTargetInput").value = "";
        document.getElementById("pocketEmojiInput").value = "💰";
        selectedColor = COLORS[state.pockets.length % COLORS.length];
        delBtn.style.display = "none";
      }
      renderColorPicker();
      openSheet("pocketSheet");
    }

    function renderColorPicker() {
      const wrap = document.getElementById("colorPicker");
      wrap.innerHTML = COLORS.map((c) => `
        <button type="button" class="color-dot ${c === selectedColor ? "selected" : ""}" style="background:${c}" onclick="selectColor('${c}')" aria-label="Warna ${c}"></button>
      `).join("");
    }

    function selectColor(c) {
      selectedColor = c;
      renderColorPicker();
    }

    function openSheet(id) {
      document.getElementById(id).classList.add("open");
    }

    function closeSheet(id) {
      document.getElementById(id).classList.remove("open");
    }

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    function launchConfetti() {
      const canvas = document.getElementById("confettiCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const pieces = Array.from({ length: 65 }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * 120,
        r: 4 + Math.random() * 5,
        c: COLORS[Math.floor(Math.random() * COLORS.length)],
        vx: (Math.random() - 0.5) * 3,
        vy: 2.5 + Math.random() * 4,
        rot: Math.random() * Math.PI * 2
      }));
      let frame = 0;
      function tick() {
        frame++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach((pt) => {
          pt.x += pt.vx;
          pt.y += pt.vy;
          pt.rot += 0.08;
          ctx.save();
          ctx.translate(pt.x, pt.y);
          ctx.rotate(pt.rot);
          ctx.fillStyle = pt.c;
          ctx.fillRect(-pt.r / 2, -pt.r / 2, pt.r, pt.r * 0.7);
          ctx.restore();
        });
        if (frame < 110) requestAnimationFrame(tick);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      requestAnimationFrame(tick);
    }

    function deleteTransaction(txId) {
      const idx = state.transactions.findIndex((t) => t.id === txId);
      if (idx === -1) return;
      const tx = state.transactions[idx];
      const p = state.pockets.find((pk) => pk.id === tx.pocketId);

      // Kembalikan efek saldo pada kantong jika kantong masih ada
      if (p) {
        if (tx.type === "deposit") {
          p.balance = Math.max(0, Number(p.balance || 0) - Number(tx.amount || 0));
        } else {
          p.balance = Number(p.balance || 0) + Number(tx.amount || 0);
        }
      }

      const rowEl = document.getElementById("tx_row_" + txId);
      state.transactions.splice(idx, 1);
      saveState();

      if (rowEl) {
        rowEl.classList.add("removing");
        setTimeout(() => {
          render();
          showToast("Riwayat transaksi dihapus");
        }, 220);
      } else {
        render();
        showToast("Riwayat transaksi dihapus");
      }
    }

    // Event Listeners
    document.querySelectorAll(".nav-item").forEach((btn) => {
      btn.addEventListener("click", () => {
        switchTabSmooth(btn.dataset.tab);
      });
    });

    document.getElementById("fabAddPocket").addEventListener("click", () => openPocketSheet(null));

    document.getElementById("privacyBtn").addEventListener("click", () => {
      state.hidden = !state.hidden;
      saveState();
      render();
      showToast(state.hidden ? "Saldo disembunyikan" : "Saldo ditampilkan");
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      saveState();
      render();
    });

    document.querySelectorAll(".q-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        const add = Number(chip.dataset.add || 0);
        const inp = document.getElementById("txAmountInput");
        inp.value = (Number(inp.value || 0) + add);
      });
    });

    document.getElementById("txSubmitBtn").addEventListener("click", () => {
      const amount = Number(document.getElementById("txAmountInput").value);
      const note = document.getElementById("txNoteInput").value.trim();
      if (!selectedTxPocketId || !amount || amount <= 0) {
        showToast("Masukkan nominal valid");
        return;
      }
      const p = state.pockets.find((item) => item.id === selectedTxPocketId);
      if (!p) return;

      if (txMode === "withdraw" && amount > p.balance) {
        showToast("Saldo kantong tidak mencukupi");
        return;
      }

      const prevPct = p.target > 0 ? (p.balance / p.target) * 100 : 0;
      p.balance = txMode === "deposit" ? Number(p.balance) + amount : Number(p.balance) - amount;
      const newPct = p.target > 0 ? (p.balance / p.target) * 100 : 0;

      state.transactions.unshift({
        id: "tx_" + Date.now(),
        pocketId: p.id,
        type: txMode,
        amount,
        note,
        date: new Date().toISOString()
      });

      saveState();
      closeSheet("txSheet");
      render();

      if (txMode === "deposit" && prevPct < 100 && newPct >= 100) {
        launchConfetti();
        showToast(`Target "${p.name}" tercapai 100%!`);
      } else {
        showToast(txMode === "deposit" ? "Setoran berhasil dicatat" : "Penarikan berhasil dicatat");
      }
    });

    document.getElementById("pocketSaveBtn").addEventListener("click", () => {
      const name = document.getElementById("pocketNameInput").value.trim();
      const target = Math.max(0, Number(document.getElementById("pocketTargetInput").value || 0));
      const emoji = document.getElementById("pocketEmojiInput").value.trim() || "💰";

      if (!name) {
        showToast("Nama kantong wajib diisi");
        return;
      }

      if (editingPocketId) {
        const p = state.pockets.find((item) => item.id === editingPocketId);
        if (p) {
          p.name = name;
          p.target = target;
          p.emoji = emoji;
          p.color = selectedColor;
        }
        showToast("Kantong diperbarui");
      } else {
        state.pockets.push({
          id: "p_" + Date.now(),
          name,
          target,
          balance: 0,
          emoji,
          color: selectedColor
        });
        showToast("Kantong baru ditambahkan");
      }

      saveState();
      closeSheet("pocketSheet");
      render();
    });

    document.getElementById("pocketDeleteBtn").addEventListener("click", () => {
      if (!editingPocketId || state.pockets.length <= 1) return;
      state.pockets = state.pockets.filter((p) => p.id !== editingPocketId);
      saveState();
      closeSheet("pocketSheet");
      render();
      showToast("Kantong dihapus");
    });

    ["txSheet", "pocketSheet"].forEach((id) => {
      document.getElementById(id).addEventListener("click", (e) => {
        if (e.target.id === id) closeSheet(id);
      });
    });

    window.addEventListener("scroll", () => {
      const hdr = document.getElementById("topHeader");
      hdr.classList.toggle("scrolled", window.scrollY > 14);
    }, { passive: true });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    render();
  </script>
</body>
</html>
